<!DOCTYPE html>
<html>

<head>

<title>Lost Items</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="lost-items-page">

<div class="container">

<h1>📋 Lost Items</h1>

<p>Browse all reported lost items</p>

<table>

<tr>

<th>ID</th>
<th>Item</th>
<th>Category</th>
<th>Description</th>
<th>Location</th>
<th>Date</th>
<th>Action</th>

</tr>

{% for item in items %}

<tr>

<td>{{ item[0] }}</td>
<td>{{ item[1] }}</td>
<td>{{ item[2] }}</td>
<td>{{ item[3] }}</td>
<td>{{ item[4] }}</td>
<td>{{ item[5] }}</td>

<td>
<a href="/claim/{{ item[0] }}">
<button class="claim-btn">📦 Claim</button>
</a>
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/dashboard">
<button class="back-btn">⬅ Back to Dashboard</button>
</a>

</div>

</body>

</html>
